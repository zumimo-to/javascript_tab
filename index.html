<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Sample</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>

</head>

<body>
  <header>
    <h1>JavaScript Sample</h1>
  </header>
  <main>
   <!--ここにHTMLを書きます-->
    <header>
    <h1>tabUI</h1>
  </header>
  <main>
   <div class="tab-container">
        <ul class="tab-buttons">
            <li class="tab-button active" data-id="news">最新記事</li>
            <li class="tab-button" data-id="popular">人気記事</li>
            <li class="tab-button" data-id="category">カテゴリ別</li>
            <li class="tab-button" data-id="author">作者別</li>
        </ul>

        <div class="tab-contents">
            <div class="tab-content active" id="news">
                <h2>最新記事</h2>
                <p>ここに最新記事の説明が入ります。</p>
            </div>
            <div class="tab-content" id="popular">
                <h2>人気記事</h2>
                <p>ここに人気記事の説明が入ります。</p>
            </div>
            <div class="tab-content" id="category">
                <h2>カテゴリ別</h2>
                <p>ここにカテゴリ別の記事が入ります。</p>
            </div>
            <div class="tab-content" id="author">
                <h2>作者別</h2>
                <p>ここにカテゴリ別の記事が入ります。</p>
            </div>
        </div>
    </div>

  </main>
  </main>
  <footer>

  </footer>
</body>

</html>
